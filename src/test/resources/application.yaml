spring:
  datasource:
    url: jdbc:h2:mem:library-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration/common

jwt:
  secret: 01234567890123456789012345678901
  expiration: 1800000
