
app:
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}


spring:

  datasource:
    url: jdbc:h2:mem:librarydb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true


  h2:
    console:
      enabled: true








  #TODO: разобраться с этой конфигурацией
  #хз чё это вообще
  output:
    ansi:
      enabled: ALWAYS

logging:
  level:
    root: INFO
    com.zhanlin.library_management_system: DEBUG
    org.springframework: INFO
    org.hibernate: WARN