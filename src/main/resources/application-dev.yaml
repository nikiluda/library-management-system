spring:

  datasource:
    url: jdbc:h2:mem:librarydb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false


  flyway:
    enabled: true
    locations:
      - classpath:db/migration/common
      - classpath:db/migration/dev

  h2:
    console:
      enabled: true

  output:
    ansi:
      enabled: ALWAYS

app:
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
